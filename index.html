<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance Passbook — AI Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cover:#123524;
    --cover-dark:#0a2116;
    --paper:#f6f1e2;
    --paper-line:#e3d9bd;
    --ink:#20291f;
    --ink-soft:#5c6355;
    --gold:#c19a3d;
    --stamp:#a3382b;
    --stamp-soft:#c96a52;
    --shadow: 0 30px 70px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    min-height:100dvh;
    display:flex;align-items:stretch;justify-content:center;
    font-family:'Inter',sans-serif;
    background:
      radial-gradient(circle at 50% -10%, #1a4630 0%, #0a140f 55%, #040705 100%);
    padding:0;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
  }

  .passbook{
    width:100%;
    max-width:100%;
    height:100vh;
    height:100dvh;
    background:var(--paper);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .writein{
    padding:14px 18px;
    background:var(--cover);
  }
  .pages, .tabs{
    width:100%;
    max-width:640px;
    margin-left:auto;
    margin-right:auto;
  }
  .cover-top, .acct-line{
    max-width:560px;
    margin-left:auto;
    margin-right:auto;
  }

  /* Cover / header — flips open on load like a real passbook cover */
  .cover{
    background:linear-gradient(160deg,var(--cover),var(--cover-dark));
    padding:22px 22px 18px;
    color:#e9e4d2;
    position:relative;
    transform-origin:top center;
    animation:coverOpen 900ms cubic-bezier(.2,.7,.3,1) both;
  }
  @keyframes coverOpen{
    0%{ transform:rotateX(-90deg); opacity:0; }
    60%{ opacity:1; }
    100%{ transform:rotateX(0deg); opacity:1; }
  }
  .cover::after{
    content:"";
    position:absolute; left:0; right:0; bottom:-1px; height:6px;
    background:repeating-linear-gradient(90deg, var(--gold) 0 10px, transparent 10px 20px);
    opacity:.55;
  }
  .cover-top{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:14px;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
  }
  .brand-mark{
    width:34px;height:34px;border-radius:50%;
    border:1.5px solid var(--gold);
    display:flex;align-items:center;justify-content:center;
    font-family:'Spectral',serif; font-weight:600; font-size:16px;
    color:var(--gold);
  }
  .brand-text .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px; letter-spacing:.14em; text-transform:uppercase;
    color:#b9caa7; opacity:.75;
  }
  .brand-text h1{
    margin:1px 0 0; font-family:'Spectral',serif; font-weight:600;
    font-size:18px; letter-spacing:.01em;
  }
  .live-dot{
    width:7px;height:7px;border-radius:50%;background:#7ec98f;
    box-shadow:0 0 8px #7ec98f;
  }
  .acct-line{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; color:#c7bd9c;
    display:flex; justify-content:space-between;
    border-top:1px dashed #ffffff22;
    padding-top:10px;
  }

  /* Ledger pages */
  .pages{
    flex:1;
    overflow-y:auto;
    padding:18px 20px 6px;
    background:
      repeating-linear-gradient(var(--paper) 0 31px, var(--paper-line) 31px 32px);
    background-position: 0 6px;
  }
  .entry{ margin-bottom:16px; }
  .entry-meta{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px; letter-spacing:.04em;
    color:var(--ink-soft);
    margin-bottom:4px;
    display:flex; align-items:center; gap:8px;
  }
  .entry-meta .who{
    text-transform:uppercase; font-weight:600;
  }
  .entry.user .entry-meta{ justify-content:flex-end; }

  .entry-body{
    font-size:14.5px; line-height:1.5; color:var(--ink);
    max-width:88%;
    white-space:pre-wrap;
  }
  .entry.bot .entry-body{
    border-left:2px solid var(--gold);
    padding-left:10px;
  }
  .entry.user .entry-body{
    margin-left:auto;
    text-align:right;
    border-right:2px solid var(--ink-soft);
    padding-right:10px;
    color:#2c3327;
  }

  .stamp{
    display:inline-flex; align-items:center; gap:5px;
    margin-top:6px;
    font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.08em;
    color:var(--stamp);
    border:1.5px solid var(--stamp-soft);
    padding:2px 7px;
    border-radius:3px;
    transform:rotate(-3deg);
    animation:stampIn 260ms ease-out both;
  }
  @keyframes stampIn{
    0%{ transform:rotate(-3deg) scale(1.6); opacity:0; }
    100%{ transform:rotate(-3deg) scale(1); opacity:1; }
  }

  .typing{
    display:flex; gap:4px; padding-left:12px;
  }
  .typing span{
    width:5px;height:5px;border-radius:50%;
    background:var(--ink-soft);
    animation:blink 1.1s infinite ease-in-out;
  }
  .typing span:nth-child(2){animation-delay:.18s;}
  .typing span:nth-child(3){animation-delay:.36s;}
  @keyframes blink{0%,80%,100%{opacity:.25;}40%{opacity:1;}}

  /* Quick actions — like index tabs on a passbook page edge */
  .tabs{
    display:flex; gap:6px; padding:10px 20px; flex-wrap:wrap;
    background:var(--paper);
    border-top:1px dashed var(--paper-line);
  }
  .tabs button{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; letter-spacing:.02em;
    background:transparent;
    border:1px solid var(--ink-soft);
    color:var(--ink);
    padding:5px 9px;
    border-radius:3px;
    cursor:pointer;
  }
  .tabs button:hover{ background:#00000008; }
  .tabs button:focus-visible{ outline:2px solid var(--stamp); outline-offset:2px; }

  /* Input row */
  .writein-inner{
    display:flex; gap:8px; align-items:center;
    max-width:640px;
    margin:0 auto;
  }
  .writein input{
    flex:1;
    background:#ffffff0f;
    border:1px solid #ffffff2a;
    border-radius:4px;
    padding:10px 12px;
    color:#f2ede0;
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    outline:none;
  }
  .writein input::placeholder{ color:#c7bd9c99; }
  .writein input:focus{ border-color:var(--gold); }
  .writein button{
    width:38px;height:38px;
    border-radius:4px;
    border:1px solid var(--gold);
    background:transparent;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    color:var(--gold);
    transition:background .15s;
    flex-shrink:0;
  }
  .writein button:hover{ background:#ffffff12; }
  .writein button:disabled{ opacity:.4; cursor:not-allowed; }
  .writein svg{ width:15px;height:15px; fill:currentColor; }

  ::-webkit-scrollbar{ width:6px; }
  ::-webkit-scrollbar-thumb{ background:#00000022; border-radius:3px; }

  @media (max-width: 480px){
    body{ padding:0; align-items:stretch; }
    .passbook{
      width:100%;
      max-width:100%;
      height:100vh;
      height:100dvh;
      border-radius:0;
      border:none;
    }
    .cover{ padding:16px 16px 14px; }
    .brand-text h1{ font-size:16px; }
    .pages{ padding:14px 16px 4px; }
    .entry-body{ font-size:14px; max-width:92%; }
    .tabs{ padding:8px 14px; }
    .tabs button{ font-size:10.5px; padding:5px 8px; }
    .writein{ padding:12px 14px; padding-bottom:max(12px, env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>

<div class="passbook">
  <div class="cover">
    <div class="cover-top">
      <div class="brand">
        <div class="brand-mark">₹</div>
        <div class="brand-text">
          <div class="eyebrow">AI-Assisted Account</div>
          <h1>Finance Passbook</h1>
        </div>
      </div>
      <div class="live-dot" title="Assistant online"></div>
    </div>
    <div class="acct-line">
      <span>Groq · gpt‑oss / qwen</span>
      <span id="sessionLabel">SESSION —</span>
    </div>
  </div>

  <div class="pages" id="pages">
    <div class="entry bot">
      <div class="entry-meta"><span class="who">Assistant</span><span id="t0"></span></div>
      <div class="entry-body">Welcome. Tell me what you spent or earned and I'll enter it in your ledger — e.g. "Paid ₹450 for groceries today". Ask for totals, a category breakdown, or an emailed summary anytime.</div>
    </div>
  </div>

  <div class="tabs">
    <button type="button" onclick="quickSend('What is my total spend this month?')">Monthly total</button>
    <button type="button" onclick="quickSend('Show my spending by category')">By category</button>
    <button type="button" onclick="quickSend('Email me a summary of my expenses')">Email summary</button>
  </div>

  <div class="writein">
    <div class="writein-inner">
      <input type="text" id="userInput" placeholder="Write an entry..." aria-label="Message the finance assistant" onkeydown="if(event.key==='Enter')sendMessage()">
      <button id="sendBtn" onclick="sendMessage()" aria-label="Send">
        <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
  // Production webhook (workflow must be Active in n8n for this URL to respond)
  const WEBHOOK_URL = "http://localhost:5678/webhook/finance-assistant-chat";

  const sessionId = "session-" + Math.random().toString(36).slice(2, 9);
  document.getElementById("sessionLabel").textContent = "SESSION " + sessionId.split("-")[1].toUpperCase();

  const pagesEl = document.getElementById("pages");
  const inputEl = document.getElementById("userInput");
  const sendBtn = document.getElementById("sendBtn");

  function timeNow(){
    return new Date().toLocaleString('en-IN', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' }).toUpperCase();
  }
  document.getElementById("t0").textContent = timeNow();

  function addEntry(text, who, opts){
    opts = opts || {};
    const wrap = document.createElement("div");
    wrap.className = "entry " + who;

    const meta = document.createElement("div");
    meta.className = "entry-meta";
    meta.innerHTML = '<span class="who">' + (who === 'user' ? 'You' : 'Assistant') + '</span><span>' + timeNow() + '</span>';

    const body = document.createElement("div");
    body.className = "entry-body";
    body.textContent = text;

    wrap.appendChild(meta);
    wrap.appendChild(body);

    if(opts.stamped){
      const stamp = document.createElement("div");
      stamp.className = "stamp";
      stamp.textContent = "✓ LOGGED";
      wrap.appendChild(stamp);
    }

    pagesEl.appendChild(wrap);
    pagesEl.scrollTop = pagesEl.scrollHeight;
    return wrap;
  }

  function showTyping(){
    const t = document.createElement("div");
    t.className = "typing";
    t.id = "typingRow";
    t.innerHTML = "<span></span><span></span><span></span>";
    pagesEl.appendChild(t);
    pagesEl.scrollTop = pagesEl.scrollHeight;
  }
  function hideTyping(){
    const t = document.getElementById("typingRow");
    if(t) t.remove();
  }

  function quickSend(text){
    inputEl.value = text;
    sendMessage();
  }

  async function sendMessage(){
    const text = inputEl.value.trim();
    if(!text) return;

    addEntry(text, "user");
    inputEl.value = "";
    sendBtn.disabled = true;
    showTyping();

    try{
      const res = await fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, sessionId: sessionId })
      });

      if(!res.ok) throw new Error("Request failed: " + res.status);

      const data = await res.json();
      hideTyping();

      const looksLogged = /logged|added|recorded|saved/i.test(data.reply || "");
      addEntry(data.reply || "No response received — try again.", "bot", { stamped: looksLogged });
    } catch(err){
      hideTyping();
      addEntry("Could not reach the ledger. Check that the workflow is Active in n8n and the webhook URL is correct.", "bot");
      console.error(err);
    } finally{
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }
</script>

</body>
</html>
